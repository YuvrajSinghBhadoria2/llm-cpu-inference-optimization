name: CPU inference benchmark

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build llama.cpp (CPU only)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DGGML_OPENMP=ON
          cmake --build /tmp/llama.cpp/build --target llama-server -j"$(nproc)"

      - name: Fetch a small GGUF model
        run: |
          mkdir -p ~/models
          curl -L -o ~/models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          # fail loudly if the download was an error page, not a real GGUF
          head -c 4 ~/models/qwen2.5-0.5b-instruct-q4_k_m.gguf | grep -q GGUF || \
            (echo "downloaded file is not a valid GGUF" && exit 1)

      - name: Run batch-size balancer (A/B)
        env:
          LLAMA: /tmp/llama.cpp/build/bin/llama-server
          MODEL: qwen2.5-0.5b-instruct-q4_k_m.gguf
          CONCURRENCY: 8
          MAX_TOKENS: 32
        run: |
          bash scripts/run_balancer.sh
          python3 scripts/plot_balancer.py results/balancer.json assets/balancer_plot.png

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: balancer-evidence
          path: |
            results/balancer.json
            assets/balancer_plot.png
